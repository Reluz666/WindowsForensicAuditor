name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Rebuild base source and apply Spanish UI
        shell: powershell
        run: |
          $chunks = Get-ChildItem buildsrc2\chunk*.txt | Sort-Object Name
          if ($chunks.Count -ne 12) { throw "Expected 12 exact source chunks, found $($chunks.Count)" }
          $joined = (($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("WindowsForensicAuditor_source.zip", [Convert]::FromBase64String($joined))
          $hash = (Get-FileHash "WindowsForensicAuditor_source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "1b8f3a4f68f58f8e226a461a2adb88982839fa83e7f072eb07d1c0491d0cea10") { throw "Base source integrity check failed" }
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive -Path WindowsForensicAuditor_source.zip -DestinationPath src -Force
          $req = Get-ChildItem -Path src -Filter requirements.txt -Recurse | Select-Object -First 1
          if (-not $req) { throw "requirements.txt not found" }
          $project = Split-Path $req.FullName -Parent
          foreach ($item in @("main.py","WindowsForensicAuditor.spec","app","tests")) {
            if (!(Test-Path (Join-Path $project $item))) { throw "Essential project item missing: $item" }
          }
          Copy-Item "overrides\app\gui\main_window.py" (Join-Path $project "app\gui\main_window.py") -Force
          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Spanish UI override applied"

      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate imports
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -c "import PySide6, psutil, win32evtlog, win32security, wmi, reportlab, jinja2; print('Windows imports OK')"

      - name: Run tests and GUI smoke test
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -m pytest -q
          python -m compileall -q app main.py
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from app.gui.main_window import MainWindow; a=QApplication([]); w=MainWindow(); print(w.windowTitle(), w.pages.count()); w.close()"

      - name: Build executable
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -m PyInstaller --clean --noconfirm WindowsForensicAuditor.spec
          if (!(Test-Path "dist\WindowsForensicAuditor.exe")) { throw "EXE was not generated" }

      - name: Verify executable and SHA256
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          $exe = Resolve-Path "dist\WindowsForensicAuditor.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Generated file is not PE/MZ" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $hash | Out-File "dist\WindowsForensicAuditor.exe.sha256.txt" -Encoding ascii
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          Copy-Item $exe "$env:GITHUB_WORKSPACE\artifacts\WindowsForensicAuditor.exe"
          Copy-Item "dist\WindowsForensicAuditor.exe.sha256.txt" "$env:GITHUB_WORKSPACE\artifacts\WindowsForensicAuditor.exe.sha256.txt"
          Write-Host "EXE SHA256: $hash"
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WindowsForensicAuditor-Espanol-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
