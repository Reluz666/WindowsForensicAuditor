name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Rebuild source ZIP
        shell: powershell
        run: |
          $b64 = Get-ChildItem buildsrc\chunk*.txt | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }
          $joined = ($b64 -join "")
          [IO.File]::WriteAllBytes("WindowsForensicAuditor_source.zip", [Convert]::FromBase64String($joined))
          Expand-Archive -Path WindowsForensicAuditor_source.zip -DestinationPath . -Force

      - name: Install dependencies
        shell: powershell
        working-directory: WindowsForensicAuditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: powershell
        working-directory: WindowsForensicAuditor
        run: |
          python -m pytest -q
          python -m compileall -q app main.py

      - name: Build executable
        shell: powershell
        working-directory: WindowsForensicAuditor
        run: |
          python -m PyInstaller --clean --noconfirm WindowsForensicAuditor.spec
          if (!(Test-Path "dist\WindowsForensicAuditor.exe")) { throw "EXE was not generated" }

      - name: Generate SHA256
        shell: powershell
        working-directory: WindowsForensicAuditor
        run: |
          (Get-FileHash "dist\WindowsForensicAuditor.exe" -Algorithm SHA256).Hash | Out-File "dist\WindowsForensicAuditor.exe.sha256.txt" -Encoding ascii
          Get-Item "dist\WindowsForensicAuditor.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WindowsForensicAuditor-Windows-x64
          path: |
            WindowsForensicAuditor/dist/WindowsForensicAuditor.exe
            WindowsForensicAuditor/dist/WindowsForensicAuditor.exe.sha256.txt
          if-no-files-found: error
          retention-days: 30
