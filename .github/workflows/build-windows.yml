name: Build Windows EXE V3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Rebuild base source and apply V2 interface
        shell: powershell
        run: |
          $chunks = Get-ChildItem buildsrc2\chunk*.txt | Sort-Object Name
          if ($chunks.Count -ne 12) { throw "Expected 12 exact source chunks, found $($chunks.Count)" }
          $joined = (($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("WindowsForensicAuditor_source.zip", [Convert]::FromBase64String($joined))
          $hash = (Get-FileHash "WindowsForensicAuditor_source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "1b8f3a4f68f58f8e226a461a2adb88982839fa83e7f072eb07d1c0491d0cea10") { throw "Base source integrity check failed" }
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive -Path WindowsForensicAuditor_source.zip -DestinationPath src -Force
          $req = Get-ChildItem -Path src -Filter requirements.txt -Recurse | Select-Object -First 1
          if (-not $req) { throw "requirements.txt not found" }
          $project = Split-Path $req.FullName -Parent
          Copy-Item "overrides\app\gui\v2_main_window.py" (Join-Path $project "app\gui\v2_main_window.py") -Force
          Copy-Item "overrides\app\gui\v2_remote_page.py" (Join-Path $project "app\gui\v2_remote_page.py") -Force
          Copy-Item "overrides\app\gui\v3_enhancements.py" (Join-Path $project "app\gui\v3_enhancements.py") -Force
          Copy-Item "overrides\app\gui\v3_main_window.py" (Join-Path $project "app\gui\v3_main_window.py") -Force
          Copy-Item "overrides\app\gui\v3_report.py" (Join-Path $project "app\gui\v3_report.py") -Force
          Copy-Item "overrides\main.py" (Join-Path $project "main.py") -Force
          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "V2 interface applied"

      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Windows imports
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -c "import PySide6, psutil, win32evtlog, win32security, wmi, reportlab, jinja2; print('Windows imports OK')"

      - name: Run unit tests
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -m pytest -q
          python -m compileall -q app main.py
          @'
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication,QDialog
          from app.gui.v3_enhancements import ProfileDialog
          app=QApplication([])
          dlg=ProfileDialog()
          QTimer.singleShot(100, dlg.accept)
          result=dlg.exec()
          assert result == QDialog.DialogCode.Accepted, result
          profile,demo=dlg.selection()
          assert profile == "Completa"
          print("Audit start dialog OK:", profile, demo)
          '@ | Set-Content -Encoding UTF8 _audit_start_dialog_test.py
          python _audit_start_dialog_test.py

      - name: Validate all V2 screens and create screenshots
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          @'
          import os, json, tempfile
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from app.gui.v3_main_window import MainWindow
          from app.engine import AuditEngine
          out,summary=AuditEngine(Path(tempfile.mkdtemp())).run(demo=True)
          data=json.loads((out/"reports"/"audit.json").read_text(encoding="utf-8"))
          data["audit_id"]=summary.get("audit_id")
          data["risk_score"]=summary.get("risk_score",data.get("risk_score",0))
          app=QApplication([])
          app.setStyle("Fusion")
          w=MainWindow()
          w.output_dir=out
          w.data=data
          w._populate_all()
          assert len(w.pages)==14, len(w.pages); assert hasattr(w,'export_full_report'); assert hasattr(w,'v3_status')
          assert len(w.nav)==14, len(w.nav)
          shots=Path(os.environ["GITHUB_WORKSPACE"])/"screenshots"
          shots.mkdir(exist_ok=True)
          for key,button in w.nav:
              w.show_page(key)
              app.processEvents()
              assert w.stack.currentWidget() is w.pages[key]
          for key in ("dashboard","remote","security","findings","evidence","reports"):
              w.show_page(key)
              w.resize(1580,930)
              w.show()
              app.processEvents()
              pm=w.grab()
              ok=pm.save(str(shots/f"{key}.png"))
              assert ok
          print("V3 GUI navigation and screenshots OK")
          w.close()
          '@ | Set-Content -Encoding UTF8 _gui_test.py
          python _gui_test.py

      - name: Run demo audit integration
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          @'
          import json, tempfile
          from pathlib import Path
          from app.engine import AuditEngine
          out,s=AuditEngine(Path(tempfile.mkdtemp())).run(demo=True)
          assert (out/"reports"/"audit.json").exists()
          assert (out/"reports"/"report.pdf").exists()
          assert (out/"reports"/"report.html").exists()
          assert (out/"reports"/"evidence_package.zip").exists()
          d=json.loads((out/"reports"/"audit.json").read_text(encoding="utf-8"))
          assert d.get("results")
          from app.gui.v3_report import generate_professional_pdf, generate_professional_html
          generate_professional_pdf(d,out,"Completa"); generate_professional_html(d,out,"Completa")
          assert (out/"reports"/"reporte_forense_profesional.pdf").exists()
          assert (out/"reports"/"reporte_forense_profesional.html").exists()
          print("Demo audit integration OK")
          '@ | Set-Content -Encoding UTF8 _demo_test.py
          python _demo_test.py

      - name: Build executable
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          python -m PyInstaller --clean --noconfirm WindowsForensicAuditor.spec
          if (!(Test-Path "dist\WindowsForensicAuditor.exe")) { throw "EXE was not generated" }

      - name: Verify executable and SHA256
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          $exe = Resolve-Path "dist\WindowsForensicAuditor.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Generated file is not PE/MZ" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $hash | Out-File "dist\WindowsForensicAuditor.exe.sha256.txt" -Encoding ascii
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          Copy-Item $exe "$env:GITHUB_WORKSPACE\artifacts\WindowsForensicAuditor.exe"
          Copy-Item "dist\WindowsForensicAuditor.exe.sha256.txt" "$env:GITHUB_WORKSPACE\artifacts\WindowsForensicAuditor.exe.sha256.txt"
          Write-Host "EXE SHA256: $hash"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WindowsForensicAuditor-V3-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: WindowsForensicAuditor-V3-Screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30
